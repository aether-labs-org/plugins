# keel template: replace every <placeholder> with this repository's real path or package, then remove this line. Protect this file with config: in .agents/keel.yml.
# clean: frameworks -> adapters -> use cases (application) -> entities (domain); dependencies point inward.
# Paste into pyproject.toml, or save as .importlinter (INI) after converting.
[tool.importlinter]
root_package = "<package>"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Architecture layers (clean)"
type = "layers"
layers = ["<frameworks>", "<adapters>", "<application>", "<domain>"]
containers = ["<package>"]

[[tool.importlinter.contracts]]
name = "The domain does not import a framework"
type = "forbidden"
source_modules = ["<package>.<domain>"]
forbidden_modules = ["django", "flask", "fastapi", "sqlalchemy"]
