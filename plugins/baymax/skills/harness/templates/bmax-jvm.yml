# bmax.yml for the JVM (Gradle; for Maven see stack-jvm.md). Replace what does not fit, then run `sh .agents/bin/bmax validate`.
# Gradle skips up-to-date tasks, so the report would be older than the run: clean the task first (cleanTest, cleanCheckstyleMain).
version: 1
guides: [AGENTS.md, CLAUDE.md, docs/review.md]
githooks: { mode: native, pre-commit: commit, pre-push: slow, commit-msg: commit-message }
scripts:
  compile:
    run: ./gradlew compileJava compileTestJava -q --console=plain
    pass_files: false
    format: errorformat
    pattern: '^(?P<file>[^:\s][^:]*\.(?:java|kt)):(?P<line>\d+): (?P<severity>error|warning): (?P<message>.*)$'
    class: correctness
    requires: [java]
  lint:
    run: ./gradlew cleanCheckstyleMain checkstyleMain --continue -q --console=plain
    pass_files: false
    format: checkstyle
    reports: "build/reports/checkstyle/main.xml"
    class: heuristic
    config: [config/checkstyle/checkstyle.xml]
    guidance: Fix the finding; do not add a suppression to silence it.
    requires: [java]
    # baseline: .agents/baselines/lint.tsv   # add when the repository already has findings (bmax measure lint)
  test:
    run: ./gradlew cleanTest test --console=plain
    pass_files: false
    format: junit
    reports: "build/test-results/test/*.xml"
    class: correctness
    timeout: 15m
    retries: 1
    requires: [java]
    guidance: Read the failing assertion. Do not change the expectation to the new value without an ADR.
  secrets:
    run: gitleaks detect --no-git --no-banner --redact --report-format sarif --report-path {report}
    format: sarif
    reports: "{report}"
    class: security
    requires: [gitleaks]
    config: [.gitleaks.toml]   # gitleaks has no .gitignore option: this file allow-lists the ignored directories (gitleaks.toml.tmpl)
  memory: { builtin: memory, class: correctness }
  merge-check: { builtin: merge-check }
  commit-message:
    builtin: commit-message
    with: { pattern: '^(feat|fix|docs|refactor|test|chore|perf|build|ci)(\(.+\))?!?: .+' }
gates:
  fast: { scripts: [guard, secrets, compile, lint], changes: worktree, ceiling: 60s }
  commit: { scripts: [guard, secrets, memory, lint], changes: staged, ceiling: 60s }
  slow: { scripts: [guard, test, merge-check], changes: branch, ceiling: 15m }
