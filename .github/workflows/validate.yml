name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: ./tests/run.sh
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate ./plugins/keel-harness --strict
