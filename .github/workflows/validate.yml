name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/kh/go.mod
      - name: Build and unit-test kh, the keel harness CLI
        run: make -C cli/kh test build
      - name: Run tests
        run: ./tests/run.sh
      - name: Run tests on the kh engine
        run: KEEL_ENGINE=cli ./tests/run.sh
      - name: kh builds are reproducible
        run: |
          make -C cli/kh dist && cp cli/kh/dist/engine/SHA256SUMS "$RUNNER_TEMP/sums"
          go clean -cache && make -C cli/kh dist && diff "$RUNNER_TEMP/sums" cli/kh/dist/engine/SHA256SUMS
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: make validate
