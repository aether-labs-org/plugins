name: Release kh

# Publishes the kh binaries when the owner pushes a tag cli/kh/vX.Y.Z (a release)
# or cli/kh/vX.Y.Z-rc.N (a pre-release). The workflow lives in keel's own
# repository; target repositories get no CI from keel.

on:
  push:
    tags:
      - 'cli/kh/v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/kh/go.mod
          cache-dependency-path: cli/kh/go.sum
      - name: Test
        run: make -C cli/kh test
      - name: Build the four platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#cli/kh/v}"
          make -C cli/kh dist VERSION="$version"
          cat cli/kh/dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'cli/kh/dist/kh-*'
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flag=""
          case "$TAG" in *-rc.*) flag="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" $flag \
            --title "kh ${TAG#cli/kh/v}" \
            --notes "kh ${TAG#cli/kh/v}. Verify with SHA256SUMS or gh attestation verify. The keel wrapper downloads and verifies this binary from keel.lock." \
            cli/kh/dist/kh-linux-amd64 cli/kh/dist/kh-linux-arm64 cli/kh/dist/kh-darwin-amd64 cli/kh/dist/kh-darwin-arm64 cli/kh/dist/SHA256SUMS
